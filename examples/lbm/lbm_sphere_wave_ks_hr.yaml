# LBM curved streaming, Kerr-Schild (M = 1), 192^3 cells over +-9, dx = 0.09375.
# Isotropic flash from a ball of radius 1 at (0,0,5); excision inside r < 1.8.
# Check: the volume integral of lbm_ekill1 (the Killing energy) is constant to round-off
# until the ingoing edge reaches the excision at t = 2.2, then falls smoothly as the hole
# absorbs the shell -- run to t = 4 to see the whole absorption ramp.
# CLUSTER SIZE, one MI300A node (4 ranks): 512 quadrants of 24^3 cells.
# 24^3 blocks with 4 ghost zones are 32^3 padded, 367 MB per quadrant, so the run
# holds ~188 GB of the node's 512 GB.  12^3 blocks would cost 2.4x that per useful
# cell.  To go finer use 32^3 blocks (717 MB per quadrant, ~367 GB) at the same level.
# Runtime: geometry pass ~9 s once (static metric), sweep ~0.43 s/step, ~1 min total.
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_sphere_wave_ks_hr"
amr: {
  npoints_block_x: 24,
  npoints_block_y: 24,
  npoints_block_z: 24,
  xmin: -9., xmax: 9.,
  ymin: -9., ymax: 9.,
  zmin: -9., zmax: 9.,
  n_ghostzones: 4,
  initial_refinement_level: 3,
  max_refinement_level: 3,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 1,
  info_output_max_reductions: ["Erad1", "lbm_geom_flag"],
  scalar_output_every: 1,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1", "lbm_ekill1"],
  volume_output_every: 12,
  plane_surface_output_every: 4,
  plane_surface_output_cell_variables: ["m1", "rates", "lbm", "alp", "rho"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  volume_output_cell_variables: ["m1", "rates", "lbm", "alp", "rho"],
  output_extra_quantities: true
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: false,
  final_iteration: 48,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  excision: { excision_criterion: "radius", excision_radius: 1.8 },
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "sphere_wave",
  sphere_wave_test: { radius: 1.0, x0: 0., y0: 0., z0: 5. },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none",
  streaming: "curved_fixed"
}
coordinate_system: { is_kerr_schild: true, bh_spin: 0.0 }
checkpoints: { checkpoint_at_termination: false }
