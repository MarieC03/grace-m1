# LBM curved streaming: a radiation pulse launched tangentially near a Schwarzschild
# black hole (Kerr-Schild, M = 1), dx = 0.09375 -- twice the resolution of the laptop test.
# Check: scripts/lbm_radial_profile.py FILE blob 7.7 puts the E-weighted centroid on the
# analytic null geodesic of impact parameter b ~ 7.7, within a cell.
# 24^3 blocks with 4 ghost zones are 32^3 padded, 367 MB per quadrant; 12^3 blocks
# cost 2.4x that per useful cell.  One MI300A node (4 ranks, 512 GB) holds ~512 of them.
# Runtime: geometry pass once (static metric), a few minutes total.
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_curved_beam_hr"
amr: {
  npoints_block_x: 24,
  npoints_block_y: 24,
  npoints_block_z: 24,
  xmin: -0.75, xmax: 8.25,
  ymin: -9., ymax: 9.,
  zmin: -9., zmax: 9.,
  n_ghostzones: 4,
  initial_refinement_level: 2,
  max_refinement_level: 2,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 1,
  info_output_max_reductions: ["Erad1", "lbm_geom_flag"],
  scalar_output_every: 1,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1", "lbm_ekill1"],
  volume_output_every: 24,
  plane_surface_output_every: 8,
  plane_surface_output_cell_variables: ["Erad1", "lbm_ekill1", "alp"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  volume_output_cell_variables: ["Erad1", "lbm_ekill1", "alp"],
  output_extra_quantities: false
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: false,
  final_iteration: 96,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  excision: { excision_criterion: "radius", excision_radius: 1.8 },
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "curved_beam",
  curved_beam_test: { z_min: 6.0, z_max: 6.75 },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "outgoing",
  streaming: "curved_fixed",
  report_timings: true
}
coordinate_system: { is_kerr_schild: true, bh_spin: 0.0 }
checkpoints: { checkpoint_at_termination: false }
