# LBM curved streaming on a TOV star (Font A0), dx = 0.15625, octant grid.
# An isotropic flash from a ball of radius 4 at the centre.  Run the Z4c and the
# Cowling twin and compare with scripts/lbm_compare_scalars.py A B 1e-3: they differ
# only by the Z4c truncation error.  lbm_ekill1 is conserved to round-off in both.
# 24^3 blocks with 4 ghost zones are 32^3 padded, 367 MB per quadrant; 12^3 blocks
# cost 2.4x that per useful cell.  One MI300A node (4 ranks, 512 GB) holds ~512 of them.
# Z4 rebuilds the geodesic map every step, so geometry_update_every trades an
# O(N dt d_t g) error for a linear cost cut; 4 is under a percent here.
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=Z4
name: "lbm_tov_z4_hr"
amr: {
  npoints_block_x: 24,
  npoints_block_y: 24,
  npoints_block_z: 24,
  xmin: 0., xmax: 30.,
  ymin: 0., ymax: 30.,
  zmin: 0., zmax: 30.,
  reflection_symmetries: {x: true, y: true, z: true},
  n_ghostzones: 4,
  initial_refinement_level: 3,
  max_refinement_level: 3,
  regrid_every: -1,
  regrid_at_postinitial: false,
  n_fmr_boxes: 0
}
IO: {
  do_initial_output: false,
  info_output_every: 1,
  info_output_max_reductions: ["Erad1", "lbm_geom_flag", "rho"],
  info_output_min_reductions: ["alp"],
  scalar_output_every: 1,
  scalar_output_minmax: ["Erad1", "alp", "rho"],
  scalar_output_integral: ["Erad1", "lbm_ekill1", "dens"],
  volume_output_every: 60,
  volume_output_cell_variables: ["Erad1", "lbm_ekill1", "alp", "rho"],
  plane_surface_output_every: 24,
  plane_surface_output_cell_variables: ["Erad1", "lbm_ekill1", "alp", "rho"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  output_use_hdf5: true,
  output_extra_quantities: false
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.25,
  force_unit_wavespeed: true,
  final_iteration: 240,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "tov",
  tov: { rho_c: 1.28e-3, press_floor: 1.6384e-22, dr: 1e-3 },
  atmosphere: { temp_fl: 1.28e-10, rho_fl: 1.28e-12 },
  c2p: { tolerance: 1e-10, max_lorentz: 50, use_c2p_entropy_backup: false },
  B_field_initialization: "none"
}
z4c: { eps_diss: 0.1, eta: 1.4 }
eos: {
  eos_type: "ideal_gas",
  ideal_gas_eos: { gamma: 2.0, kappa_id: 100 },
  eps_maximum: 1.e+05
}
m1: {
  id_type: "sphere_wave",
  sphere_wave_test: { radius: 4.0, x0: 0., y0: 0., z0: 0. },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none",
  streaming: "curved_fixed",
  geometry_update_every: 4,
  report_timings: true
}
checkpoints: { checkpoint_at_startup: false, checkpoint_at_termination: false }
