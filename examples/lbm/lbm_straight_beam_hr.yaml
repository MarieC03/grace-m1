# LBM straight beam at cluster resolution: 192^3 cells over +-1, dx = 0.0104.
# A pencil enters from -x along +x and must stay collimated; with bc_kind: none the
# ghost zones keep feeding it, so it reaches a steady state across the domain.
#
# This is the cleanest measurement of the ONE error the resolution cannot fix.  The
# initial data seeds a von Mises-Fisher beam whose sharpness the quadrature caps at
# sigma_max = L(L+1)/(2 ln 1000) -- the startup banner prints it and the opening
# half-angle, 7.2 deg for Lebedev29 and 4.0 deg for Lebedev53.  What to look for:
#   - E on the axis falls off as the beam opens, not from numerical diffusion;
#     the transverse rms should grow linearly with x at exactly that half-angle
#   - |F|/E on the axis stays at flux_of_sigma(sigma_max), 0.984 for Lebedev29
#   - nothing outside the cone
# Compare Lebedev29 and Lebedev53 builds on this parfile to see the cap at work.
# 512 quadrants of 24^3, ~188 GB with Lebedev29 and ~550 GB with Lebedev53 (two nodes).
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_straight_beam_hr"
amr: {
  npoints_block_x: 24,
  npoints_block_y: 24,
  npoints_block_z: 24,
  xmin: -1., xmax: 1.,
  ymin: -1., ymax: 1.,
  zmin: -1., zmax: 1.,
  n_ghostzones: 4,
  initial_refinement_level: 3,
  max_refinement_level: 3,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 24,
  info_output_max_reductions: ["Erad1", "lbm_niter"],
  scalar_output_every: 24,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1"],
  plane_surface_output_every: 24,
  plane_surface_output_cell_variables: ["m1", "rates", "lbm", "alp"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  volume_output_cell_variables: ["m1", "rates", "lbm", "alp"],
  output_extra_quantities: true
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: true,
  final_iteration: 240,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "straight_beam",
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none"
}
checkpoints: { checkpoint_at_termination: false }
