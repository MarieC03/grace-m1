# LBM crossed beams: two free-streaming pencils, one entering from -x along +x and
# one from -y along +y, crossing at the origin.  Where they overlap |F|/E = 1/sqrt(2),
# which a two-moment closure reads as a broad distribution and transports along the
# diagonal, merging the beams; the LBM keeps them in separate stencil directions and
# they pass through each other.
# Check (scripts/lbm_radial_profile.py FILE crossed 0.125): beyond the crossing both
# beams keep E ~ 1 along their own axis, and the diagonal quadrant stays at the floor.
# The M1 twin is examples/lbm/m1_crossed_beams.yaml.
# The reference (Olsen & Rezzolla 2025) crosses at 37 degrees; separating that needs
# the adaptive stencil, since the fixed Lebedev29 seeding opens each beam to ~10 deg.
# 8 quadrants of 16^3, dx = 0.0625, beams 4 cells wide.
# M1 twin of test/configs/lbm_crossed_beams.yaml: same grid, same end time (t = 2.25),
# imex222 at cfl 0.25 because the rk3 branch never calls the implicit substep.
# Expect the two beams to MERGE into one diagonal beam -- the closure failing, and the
# reason for a direction-resolved scheme.
# Build: -DGRACE_RADIATION_SCHEME=M1 -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "m1_crossed_beams"
amr: {
  npoints_block_x: 16,
  npoints_block_y: 16,
  npoints_block_z: 16,
  xmin: -1., xmax: 1.,
  ymin: -1., ymax: 1.,
  zmin: -1., zmax: 1.,
  n_ghostzones: 4,
  initial_refinement_level: 1,
  max_refinement_level: 1,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 16,
  info_output_max_reductions: ["Erad1"],
  scalar_output_every: 16,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1"],
  volume_output_every: 144,
  volume_output_cell_variables: ["Erad1"],
  plane_surface_output_every: 14,
  plane_surface_output_cell_variables: ["Erad1"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  output_extra_quantities: false
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "imex222",
  cfl_factor: 0.25,
  force_unit_wavespeed: true,
  final_iteration: 144,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "crossed_beams",
  crossed_beams_test: { half_width: 0.125, start: -0.5 },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
checkpoints: { checkpoint_at_termination: false }
