# LBM crossed beams at cluster resolution: 192^3 cells over +-1, dx = 0.0104, so each
# beam is 24 cells across instead of 4.  Two free-streaming pencils, one along +x and one
# along +y, crossing at the origin; they must pass through each other.
# At this resolution numerical diffusion is negligible and what remains is the ANGULAR
# error: the fixed Lebedev29 stencil opens each beam into a ~10 degree cone (the von
# Mises-Fisher seeding saturates at |F|/E = 0.983).  That is what the adaptive stencil
# would fix, and this run is the clean measurement of it.
# Check: scripts/lbm_radial_profile.py FILE crossed 0.125 0.0104
# CLUSTER SIZE, one MI300A node (4 ranks): 512 quadrants of 24^3 cells.
# 24^3 blocks with 4 ghost zones are 32^3 padded, 367 MB per quadrant, so the run
# holds ~188 GB of the node's 512 GB.  12^3 blocks would cost 2.4x that per useful
# cell.  To go finer use 32^3 blocks (717 MB per quadrant, ~367 GB) at the same level.
# Runtime: flat space, no geometry pass; sweep ~0.43 s/step, ~2 min total.
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_crossed_beams_hr"
amr: {
  npoints_block_x: 24,
  npoints_block_y: 24,
  npoints_block_z: 24,
  xmin: -1., xmax: 1.,
  ymin: -1., ymax: 1.,
  zmin: -1., zmax: 1.,
  n_ghostzones: 4,
  initial_refinement_level: 3,
  max_refinement_level: 3,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 24,
  info_output_max_reductions: ["Erad1"],
  scalar_output_every: 24,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1"],
  volume_output_every: 60,
  volume_output_cell_variables: ["m1", "rates", "lbm", "alp", "rho"],
  plane_surface_output_every: 24,
  plane_surface_output_cell_variables: ["m1", "rates", "lbm", "alp", "rho"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  output_extra_quantities: true
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: true,
  final_iteration: 240,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "crossed_beams",
  crossed_beams_test: { half_width: 0.125, start: -0.5 },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none",
  initial_data: "intensities"
}
checkpoints: { checkpoint_at_termination: false }
