# LBM sphere-wave test across a coarse-fine face: 8^3 blocks, base dx=1/16, the octant
# [0,0.5]^3 refined to dx=1/32, flash from r<0.125 at the origin (71 quadrants, ~2.6 GB).
# Check: the Erad1 integral stays within ~1% while the shell crosses the refinement
# faces (prolongation/restriction of the populations is not flux-corrected), Erad1 and
# the populations stay >= the floor.
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_sphere_wave_amr"
amr: {
  npoints_block_x: 8,
  npoints_block_y: 8,
  npoints_block_z: 8,
  xmin: -1., xmax: 1.,
  ymin: -1., ymax: 1.,
  zmin: -1., zmax: 1.,
  n_ghostzones: 4,
  initial_refinement_level: 2,
  max_refinement_level: 3,
  regrid_every: -1,
  regrid_at_postinitial: false,
  n_fmr_boxes: 1,
  fmr_boxes: [ { target_level_delta: 1, x_min: 0.01, x_max: 0.49, y_min: 0.01, y_max: 0.49, z_min: 0.01, z_max: 0.49 } ],
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 1,
  info_output_max_reductions: ["Erad1"],
  scalar_output_every: 1,
  scalar_output_minmax: ["Erad1", "I1_0"],
  scalar_output_integral: ["Erad1"],
  volume_output_every: 24,
  plane_surface_output_every: -1,
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  volume_output_cell_variables: ["Erad1"],
  output_extra_quantities: false
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: true,
  final_iteration: 24,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "sphere_wave",
  sphere_wave_test: { radius: 0.125 },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none"
}
checkpoints: { checkpoint_at_termination: false }
