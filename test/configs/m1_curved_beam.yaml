# M1 curved beam: a packet launched along +x from x <= 1/64, |y| < 0.25,
# z_min <= z <= z_max on a Schwarzschild background (M = 1, Kerr-Schild coordinates),
# with F_i F^i = 0.9999 E^2 so it starts as close to free-streaming as the closure
# allows.  It should follow the null geodesic of its impact parameter,
# b = z0/sqrt(1-2M/z0) ~ 7.7 here, bending by ~4M/b.
# NB b_crit = 3 sqrt(3) = 5.196: the schema default patch (z 3.0-3.5, z0 = 3.25) gives
# b = 5.24 and is marginally captured, which is why this file sets 6.0-6.75.
# Check: the E-weighted centroid of the bent beam against the analytic null geodesic.
# int(Erad1) RISES as the domain fills with beam -- that is the injection, not a
# conservation failure; it should plateau once the beam reaches the far boundary.
# NB Erad and Nrad diverge by construction: the geometric source terms act on E
# and F only (m1.hh compute_source_terms), never on N, because neutrino NUMBER is
# conserved along the flow while its ENERGY redshifts.  MEASURED E-weighted mean
# E/N over the beam at t = 9.19: 1.36.  E/N = 1 everywhere at t = 0.
# LBM twin: test/configs/lbm_curved_beam.yaml (same grid, rk3 at cfl 0.9, 24 iterations).
# 32 quadrants of 12^3, dx = 0.375.
# Build: -DGRACE_RADIATION_SCHEME=M1 -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
#        and a Kerr-Schild (cks) coordinate system.
name: "m1_curved_beam"
amr: {
  npoints_block_x: 12,
  npoints_block_y: 12,
  npoints_block_z: 12,
  xmin: -0.75, xmax: 8.25,
  ymin: -9., ymax: 9.,
  zmin: -9., zmax: 9.,
  n_ghostzones: 4,
  initial_refinement_level: 1,
  max_refinement_level: 1,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 24,
  info_output_max_reductions: ["Erad1"],
  scalar_output_every: 24,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1"],
  volume_output_every: 96,
  volume_output_cell_variables: ["m1", "rates"],
  plane_surface_output_every: 96,
  plane_surface_output_cell_variables: ["m1", "rates"],
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  output_extra_quantities: true
}
evolution: {
  time_stepper: "imex222",
  cfl_factor: 0.25,
  force_unit_wavespeed: false,
  final_iteration: 96,
  termination_condition: "iteration"
}
m1: {
  id_type: "curved_beam",
  # Fixed ghosts (the ID), i.e. the beam is CONTINUOUSLY INJECTED at the -x face
  # and the test runs toward a steady bent beam -- the standard form of this
  # problem, and what the LBM twin does.  The default "outgoing" is wrong here:
  # the source patch abuts xmin, so a zeroth-order outflow extrapolation feeds
  # the beam back in anyway, just less controllably.
  bc_kind: "none",
  curved_beam_test: { z_min: 6.0, z_max: 6.75 },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
grmhd: {
  id_type: "minkowski_vacuum",
  excision: { excision_criterion: "radius", excision_radius: 1.8 },
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
coordinate_system: { is_kerr_schild: true, bh_spin: 0.0 }
checkpoints: { checkpoint_at_termination: false }
