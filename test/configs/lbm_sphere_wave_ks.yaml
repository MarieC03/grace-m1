# LBM curved streaming: isotropic flash from a ball of radius 1 centred at (0,0,5) on the
# Schwarzschild background (M = 1, Cartesian Kerr-Schild coordinates via
# coordinate_system.is_kerr_schild; the shift is nonzero), excision inside r < 1.8.
# Check: the volume integral of lbm_ekill1 = sqrt(gamma)(alpha E - beta_i F^i), the Killing
# energy, is constant to round-off (1e-10 by t = 2 with the conservative remap; the pointwise
# sweep, lbm.curved_remap: pointwise, drifts by 6e-3) until the shell reaches the excision or
# the boundary; the integral of Erad1 alone is NOT conserved in these coordinates.
# 64 quadrants of 12^3 cells, dx = 0.375, ~5.9 GB (302 populations x 3 registers + claim weights).
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_sphere_wave_ks"
amr: {
  npoints_block_x: 12,
  npoints_block_y: 12,
  npoints_block_z: 12,
  xmin: -9., xmax: 9.,
  ymin: -9., ymax: 9.,
  zmin: -9., zmax: 9.,
  n_ghostzones: 4,
  initial_refinement_level: 2,
  max_refinement_level: 2,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: false}
}
IO: {
  info_output_every: 1,
  info_output_max_reductions: ["Erad1", "lbm_geom_flag"],
  scalar_output_every: 1,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1", "lbm_ekill1"],
  volume_output_every: 6,
  plane_surface_output_every: -1,
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  volume_output_cell_variables: ["Erad1", "lbm_ekill1", "alp"],
  output_extra_quantities: false
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: false,
  final_iteration: 6,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  excision: { excision_criterion: "radius", excision_radius: 1.8 },
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "sphere_wave",
  sphere_wave_test: { radius: 1.0, x0: 0., y0: 0., z0: 5. },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none",
  streaming: "curved_fixed"
}
coordinate_system: { is_kerr_schild: true, bh_spin: 0.0 }
checkpoints: { checkpoint_at_termination: false }
