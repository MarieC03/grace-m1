# LBM sphere-wave test with a z reflection symmetry: the upper half of
# lbm_sphere_wave.yaml (four unit trees at level 0 give the same dx = 1/16).  Check: the Erad1 integral is exactly half of the full-domain
# run and Erad1 [max] is identical -- the reflected ghosts read the population of the
# mirrored stencil direction (var_reflect_partner).
# Build: -DGRACE_RADIATION_SCHEME=LBM -DGRACE_M1_NU_SPECIES=1 -DGRACE_METRIC_EVOL=COWLING
name: "lbm_sphere_wave_zrefl"
amr: {
  npoints_block_x: 16,
  npoints_block_y: 16,
  npoints_block_z: 16,
  xmin: -1., xmax: 1.,
  ymin: -1., ymax: 1.,
  zmin: 0., zmax: 1.,
  n_ghostzones: 4,
  initial_refinement_level: 0,
  max_refinement_level: 1,
  regrid_every: -1,
  regrid_at_postinitial: false,
  reflection_symmetries: {x: false, y: false, z: true}
}
IO: {
  info_output_every: 1,
  info_output_max_reductions: ["Erad1"],
  scalar_output_every: 1,
  scalar_output_minmax: ["Erad1"],
  scalar_output_integral: ["Erad1"],
  volume_output_every: -1,
  plane_surface_output_every: -1,
  sphere_surface_output_every: -1,
  diagnostic_output_every: -1,
  volume_output_cell_variables: ["Erad1"],
  output_extra_quantities: false
}
system: {
  console_log_level: "info",
  file_log_level: "info",
  flush_logs_based_on_severity: false,
  n_device_streams: 1
}
evolution: {
  time_stepper: "rk3",
  cfl_factor: 0.9,
  force_unit_wavespeed: true,
  final_iteration: 12,
  termination_condition: "iteration"
}
grmhd: {
  id_type: "minkowski_vacuum",
  vacuum: {
    rho_floor: 1e-20, press_floor: 1e-30,
    velocity_x: 0., velocity_y: 0., velocity_z: 0.
  },
  atmosphere: { ye_fl: 0, temp_fl: 0, rho_fl: 1e-50, rho_scaling: 0, temp_scaling: 0 }
}
eos: {
  eos_type: "hybrid",
  hybrid_eos: { cold_eos_type: "piecewise_polytrope", gamma_th: 1.8 },
  eps_maximum: 1e+05,
  piecewise_polytrope: { n_pieces: 1, gammas: [ 2. ], rhos: [ ], kappa_0: 1.0 }
}
m1: {
  id_type: "sphere_wave",
  sphere_wave_test: { radius: 0.125 },
  eas: { kinds: ["test"] },
  backreaction: { enabled: false }
}
lbm: {
  bc_kind: "none"
}
checkpoints: { checkpoint_at_termination: false }
