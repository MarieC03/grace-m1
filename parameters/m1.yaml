m1:
  description: >
    M1 scheme
  type: schema

  bc_kind:
    type: keyword
    allowed: ["outgoing", "none"]
    default: "outgoing"
    description: >
      Boundary conditions

  id_type:
    type: keyword
    allowed: ["straight_beam", "crossed_beams", "scattering", "shadow", "emitting_sphere", "zero", "curved_beam", "equilibrium"]
    default: "zero"
    description: >
      Initialization prescription for radiation fields.  "equilibrium" sets
      the radiation in LTE-blended equilibrium with the (already-set) hydro
      background using the current EAS (kappa/eta from aux) -- works on any
      matter ID (e.g. hot_tov), unlike the test-only beam/scattering/sphere
      kinds which require grmhd.id_type = minkowski_vacuum.

  atmosphere:
    type: schema
    description: >
      Atmosphere settings for M1

    E_fl:
      type: double
      range: "(0,*)"
      default: 1.e-14
      description: >
        Floor of energy density

    E_scaling:
      type: double
      range: "[0,*)"
      default: 0
      description: >
        Radial dependence of energy density floor

    r_damping:
      type: double
      range: "(0,*)"
      default: 1.e100
      description: >
        Beyond this radius both floors are multiplied by (r_damping/r)^2, never
        below 1e-20 (FIL: frankfurt_m1::r_atmo_damping).  A constant floor is a
        luminosity threshold 4 pi r^2 E_fl that GROWS with radius (1e52 erg/s per
        species at r = 500 for E_fl = 1e-14) and erases the tail of a burst on
        its way out; with damping the threshold stays at 4 pi r_damping^2 E_fl.
        The default is so large that the floors are unchanged.

    N_fl:
      type: double
      range: "(0,*)"
      default: 1.e-14
      description: >
        Floor of neutrino NUMBER density, independent of E_fl (FIL parity:
        frankfurt_m1::N_atmo).  Previously the number floor was derived as
        E_fl/eps_fl, which made it disagree with the initial data whenever
        eps_fl was not 1 and let a healthy N be rewritten as N*eps_fl.

    N_scaling:
      type: double
      range: "[0,*)"
      default: 0
      description: >
        Radial dependence of the number density floor, N_fl * r^x

    eps_fl:
      type: double
      default: 1
      range: "(0,*)"
      description: >
        Flooring value for average energy

    eps_min:
      type: double
      default: 1
      range: "(0,*)"
      description: >
        Minimum allowed average energy

    eps_max:
      type: double
      default: 1
      range: "(0,*)"
      description: >
        Maximum allowed average energy

    eps_scaling:
      type: double
      default: 0
      range: "[0,*)"
      description: >
        Value to scale eps floor with r^x

  excision:
    type: schema
    description: >
      Excision parameters for M1 transport

    E_excision:
      type: double
      default: 1.e-14
      range: "(0,*)"
      description: >
        Value of the EVOLVED (densitised) energy density inside excised regions,
        i.e. what the output shows there; no factor sqrt(gamma) is applied, so
        the region appears at exactly this value.

    eps_excision:
      type: double
      default: 1
      range: "(0,*)"
      description: >
        Value of average energy inside excised regions

  eas:
    type: schema
    description: >
      Parameters controlling emission absorption and scattering rates

    kind:
      type: keyword
      allowed: ["test", "photon_rates", "neutrino_analytic", "neutrino_weakhub", "bns_nurates"]
      default: "test"
      description: >
        EAS provider (single).  Ignored when 'kinds' is non-empty.

    kinds:
      type: list
      item_type: string
      default: []
      description: >
        EAS providers to run, in order (composable form).  Same values as
        'kind'.  Combining photon_rates with a neutrino provider requires
        a build with -DGRACE_M1_PHOTONS=ON.  Empty list falls back to the
        scalar 'kind'.

    use_analytic:
      type: bool
      default: true
      description: >
        Deprecated — no longer read by the code. The EAS provider is selected
        exclusively via 'kind' / 'kinds'. This parameter is kept only for
        backwards compatibility with old parameter files and has no effect.

    beta_decay:
      type: bool
      default: true
      description: >
        Include charged-current (beta-decay) reactions in the analytic neutrino
        rates: p + e- <-> n + nue and n + e+ <-> p + anti-nue.  These are the
        dominant source of nue/anti-nue emission and absorption near the
        neutrinosphere.  Analytic rate path only; the weakhub table always
        includes beta processes.

    plasmon_decay:
      type: bool
      default: true
      description: >
        Include plasmon decay (gamma* -> nu + anti-nu) emission.  Contributes
        to all species at high density.  Applied in both the analytic and
        weakhub paths (added on top of the table opacities in the latter).

    bremsstrahlung:
      type: bool
      default: true
      description: >
        Include nucleon-nucleon bremsstrahlung (NN -> NN + nu + anti-nu)
        emission.  Dominant nux emission channel at low temperatures.  Applied
        in both the analytic and weakhub paths (added on top of the table
        opacities in the latter).

    pair_treatment:
      type: keyword
      allowed: ["legacy", "equilibrium", "evolved"]
      default: "legacy"
      description: >
        Heavy-flavour thermal pairs. New modes use blocked isotropic spectral
        kernels; equilibrium freezes the partner at matter LTE, evolved couples
        the two M1 source updates. Require analytic/WeakHub EAS, 3/5 species,
        bns_nurates and betaeq_policy=off. See developer_guide/pair_processes.md.

    pair_quadrature_order:
      type: int
      range: "[8,32]"
      default: 16
      description: >
        Nodes per energy dimension. Check convergence with 24 and 32,
        especially for degeneracy or the plasmon threshold.

    pair_trace_iterations:
      type: int
      range: "[0,*)"
      default: 0
      description: >
        Debug only: for this many steps after startup/restart, print per-rank,
        per-species moment summaries around ARS IMEX stages and pair source /
        backreaction updates. Includes ghost cells. Adds reductions and host
        synchronization; zero disables it. The reported E/N mean is a lab-frame
        energy-per-number proxy, not the comoving mean used by pair kernels.

    muon_decay:
      type: bool
      default: false
      description: >
        Include mu- <-> e- + numu + anti-nue and the charge conjugate.
        Requires five species, leptonic EOS without dilute-muon suppression,
        additive electron thermodynamics and non-legacy pair_treatment.
        Equilibrium partners are a non-stoichiometric comparison approximation
        away from LTE; evolved partners use a connected four-species solve.

    muon_decay_kernel_order:
      type: int
      range: "[8,64]"
      default: 24
      description: >
        Gauss nodes for each inner decay-kernel integral (angle and charged
        lepton energy). Independent of pair_quadrature_order. Check convergence.

    weakhub_muon_decay_content:
      type: keyword
      allowed: ["unknown", "none", "included"]
      default: "unknown"
      description: >
        Table provenance declaration, not a filter. Explicit muon decay requires
        none so that inclusive grey tables cannot silently double count decay.

    weakhub_pair_content:
      type: keyword
      allowed: ["unknown", "none", "included"]
      default: "unknown"
      description: >
        User declaration of table provenance. New pair treatments require none;
        this setting does not subtract channels from an inclusive table.

    pair_plasmon_model:
      type: keyword
      allowed: ["none", "transverse_mass"]
      default: "none"
      description: >
        Explicit opt-in for transverse constant-mass plasmons with relativistic
        electron plasma frequency. Omits longitudinal, axial, mixed and muon
        plasma contributions. Required for new modes with plasmon_decay=true.

    pair_annihilation:
      type: bool
      default: true
      description: >
        Include electron-positron pair annihilation (e+ + e- -> nu + anti-nu)
        emission.  Contributes to all species at high temperatures.  Applied in
        both the analytic and weakhub paths (added on top of the table opacities
        in the latter).

    betaeq_policy:
      type: keyword
      allowed: ["off", "chemical", "timescale", "gieg"]
      default: "off"
      description: >
        Per-cell beta-equilibrium policy applied before evaluating the rates.
        off: Ye is used as-is from the evolved state (default).
        chemical: Ye is reset to the chemical beta-equilibrium value
        (mu_e + mu_p = mu_n + Qnp) at the local (rho, T) before computing
        rates — appropriate for optically thick regions.
        timescale: (T, Ye, Ymu) relaxed jointly toward radiation-matter
        equilibrium using a SINGLE global timescale (min over all species).
        gieg: per-flavor TWO-timescale equilibration (Gieg+ 2026, Table 3) —
        electron and muon sectors classified independently (tau_e, tau_mu) and
        equilibrated only where their own neutrinos are (partially) trapped;
        a free-streaming flavor is left to the rates (5-species only).
        CAVEAT: 'gieg' relaxes matter and radiation to (partial) EQUILIBRIUM
        states and does NOT capture non-equilibrium neutrino distribution
        effects (gray, LTE-equilibrium approximation); the partially-trapped /
        transition regime is approximate.  It also decides trapping from the
        local equilibration timescale, so it is REDUNDANT with (and the
        tau-driven degeneracy rescaling is inconsistent with) an eikonal
        optical depth — set tau_policy='none' when using 'gieg'.  Both
        conditions emit a runtime warning at M1 setup.

    betaeq_partial_e_fallback:
      type: bool
      default: false
      description: >
        betaeq_policy = 'timescale', 5-species builds only.  When the joint
        (Ye, Ymu, T) equilibrium solve fails, retry it for (Ye, T) with Ymu held
        at its current value (the 'gieg' PARTIAL_E solve) and use that result.
        Typical rescue: cool matter whose muon equilibrium lies below the Ymu
        table floor.  FIL reaches the same state by setting eta_numu = 0 for
        Ymu < 0.005.  Solves that already succeed are unchanged; rescued cells
        carry BETAEQ_PARTIAL_E_FALLBACK in betaeq_err and are counted separately
        in the per-step log.  Ignored in other builds and policies.

    betaeq_fallback_ymu_floor:
      type: bool
      default: false
      description: >
        Only with betaeq_partial_e_fallback = true.  In a cell whose joint solve
        failed, hold Ymu at the table floor instead of at its current value when
        the muon equilibrium lies below the floor (muon-lepton residual positive
        at the floor), so the muon rates target the floor state and the lagged
        exchange stops overshooting.  Affects the rates only (the closure writes
        no grid function).  Such cells also carry BETAEQ_YMU_FLOOR_HOLD.

    temperature_correction:
      type: bool
      default: true
      description: >
        Apply a spectral temperature correction to the neutrino opacities.
        The effective neutrino temperature T_nu is derived from the radiation
        field's fluid-frame mean energy via the Fermi-Dirac ratio FD(2)/FD(3),
        and the opacities are rescaled by (T_nu / T_fluid)^2 when
        T_nu > T_fluid.  For nue and nuebar this scales kappa_a, kappa_n and
        kappa_s (Q and R only with temperature_correction_emission); for nux
        only kappa_s is corrected; muon species are not corrected (the weakhub
        table already carries the spectral information).  When no radiation
        is present (eps_rad = 0, e.g. at it=0 or in the atmosphere) the
        correction is inert (factor = 1).

    temperature_correction_emission:
      type: bool
      default: false
      description: >
        Also multiply the nue/nuebar emissivities Q and R by the
        temperature_correction factor, as FIL's Weakhub and analytic
        'corrected' EAS routines do (driver_get_eas.cc).  Off (default): the
        factor acts on the opacities only (absorption of hot neutrinos by
        colder matter); the emission depends on the matter alone.  Only
        matters with temperature_correction = true.

    tau_outer_radius_code:
      type: double
      range: "[0,*)"
      default: 0
      description: >
        Outer radius [code units] of the optical-depth path estimate.
        Required (> 0) by tau_policy local_kappa (and by local_spherical, which
        is deprecated -- see tau_policy).  Unused by eikonal, which solves for
        tau rather than estimating a path length.

    tau_policy:
      type: keyword
      allowed: ["analytic_density","local_spherical","local_kappa","eikonal","none"]
      default: "none"
      description: >
        Optical depth used to suppress the neutrino fugacities
        (eta_nu -> eta_nu * (1 - exp(-tau))).

        IMPORTANT: the suppression is applied to the ELECTRON FLAVOURS ONLY
        (nue, nuebar).  The muon flavours and nux are handled by the dilute-Ymu
        treatment instead (the mu_mu tanh ramp below Y_mu,0, the +/-5 fugacity
        clamp, and the muon rate gate), so tau is neither computed nor stored
        for them -- there are no optd3/4/5 fields.

        none (default): thin limit everywhere.

        analytic_density: Deaton+ 2013 density fit.  COLD NS only -- known to
        fail for hot matter, so not appropriate for a post-merger remnant.

        local_spherical: DEPRECATED, and NOT what its name suggests.  The
        kappa * (r_outer - r) geometry it is supposed to compute lives in the
        tau_post hook, whose result is discarded (see "Step 9" in
        eas_neutrino_rates_analytic.hh); its tau_init returns the cold fit.  At
        runtime this policy is therefore IDENTICAL to analytic_density, with
        the same hot-matter failure.  Prefer eikonal, or local_kappa.

        local_kappa: per-species (kappa_a + kappa_s) * (r_outer - r) using the
        previous step's opacities; thin at t=0, builds up within one step.
        Requires tau_outer_radius_code > 0.

        eikonal: Neilsen+ 2014 min-path relaxation -- the physically
        best-motivated option, and the only one that is not a geometric
        estimate.  Solves |grad tau| = kappa by a min-path Jacobi sweep over
        the OPTD* fields once per substep, ordered tau -> ghost exchange ->
        kappa so the fugacities see a freshly exchanged tau.
        REQUIRES the build flag -DGRACE_M1_OPTICAL_DEPTH=ON (OFF by default);
        selecting it without that flag is a startup error, since the OPTD*
        evolved fields it relaxes do not exist otherwise.

    weakhub_table:
      type: string
      default: ""
      description: >
        Absolute path to the Weakhub HDF5 opacity table.  Required when
        kind/kinds includes 'neutrino_weakhub'.  The table provides grey
        absorption and scattering opacities as functions of density, temperature,
        Ye, and Ymu for up to 6 neutrino species.



  crossed_beams_test:
    type: schema
    description: >
      Two free-streaming pencils crossing at the origin, one entering from -x
      along +x and one from -y along +y (m1.id_type = crossed_beams).  The
      source patches are disjoint for half_width < |start|.

      Where the beams overlap |F|/E = 1/sqrt(2), which a two-moment closure
      reads as a broad distribution and transports along the diagonal: the two
      beams MERGE.  That failure is the point of the test -- it is the standard
      demonstration that a two-moment closure cannot represent crossing
      radiation, and the reason for a direction-resolved scheme.

    half_width:
      type: double
      default: 0.125
      range: "(0,*)"
      description: >
        Transverse half-width of each beam.

    start:
      type: double
      default: -0.5
      range: "(*,0)"
      description: >
        Each beam's source patch runs from the domain edge to this coordinate.

  curved_beam_test:
    type: schema
    description: >
      Height of the source patch of the curved-beam test (m1.id_type =
      curved_beam) on the Schwarzschild background in Kerr-Schild coordinates.

      The packet is launched along +x at height z0 ~ (z_min+z_max)/2, so its
      impact parameter is b = z0 / sqrt(1 - 2M/z0).  This must stay clear of
      b_crit = 3 sqrt(3) = 5.196 or the packet is captured rather than bent:
      z0 = 3.25 gives b = 5.24, marginal.  The defaults keep the historical
      3.0-3.5 patch; z_min 6.0 / z_max 6.75 gives b = 7.7 and a clean escape.

    z_min:
      type: double
      default: 3.0
      range: "(0,*)"
      description: >
        Lower edge of the source patch [code units].

    z_max:
      type: double
      default: 3.5
      range: "(0,*)"
      description: >
        Upper edge of the source patch [code units].

  scattering_test:
    type: schema
    description: >
      Parameters of scattering test

    k_s:
      type: double
      default: 100
      range: "(0,*)"
      description: >
        Constant scattering opacity

    t_0:
      type: double
      default: 1
      range: "(0,*)"
      description: >
        Time of initial data

    is_static_background:
      type: bool
      default: true
      description: >
        Is background fluid static or moving?

  emitting_sphere_test:
    type: schema
    description: >
      Parameters for emitting sphere test

    temperature:
      type: double
      default: 1
      range: "(0,*)"
      description: >
        Temperature for rates

    cross_section:
      type: double
      default: 10
      range: "(0,*)"
      description: >
        Cross section for rates

  backreaction:
    type: schema
    description: >
      Parameters controlling the coupling of the radiation field back to the
      fluid (energy and momentum source terms in the GRMHD equations).

    enabled:
      type: bool
      default: true
      description: >
        Enable radiation-matter backreaction.  When false, the fluid evolves
        without any M1 source terms (useful for testing transport in a frozen
        background).

    t_start:
      type: double
      default: -1
      range: "[-1,*)"
      description: >
        Simulation time at which backreaction is activated.  Negative value
        (default -1) means active from the start.  Useful to let the radiation
        field build up before coupling it to the fluid.

    rho_min:
      type: double
      default: 0.0
      range: "[0,*)"
      description: >
        !!! DO NOT USE !!!
        Density cutoff [code units] for the radiation->fluid coupling.  In
        cells with rho < rho_min the backreaction (energy, momentum AND
        composition) is skipped entirely, leaving the near-empty
        halo/atmosphere fluid untouched.  Those cells hold ~zero baryons, so a
        physically negligible collision exchange becomes huge per baryon
        (dE/tau, dN/D) and distorts the primitives/composition -- an effect the
        in-bounds limiters cannot catch because it lands INSIDE the table
        bounds.  This is FIL's M1_rho_floor.  0 (default) disables the cutoff.
        A few x the atmosphere floor grmhd.atmosphere.rho_fl is a typical value.

    muon_partial_at_bound:
      type: bool
      default: false
      description: >
        5-species hard-stop builds only.  When the muon pair's exchange would take
        Ymu outside the table, accept the fraction f of the WHOLE pair exchange
        (E, F and N of numu and anti-numu alike) that lands Ymu just inside the
        bound, instead of reverting the pair.  The radiation keeps old + f (new -
        old), so energy, momentum and muon lepton number are conserved and E/N
        does not drift.  The electron pair keeps the all-or-nothing hard stop.
        Partly accepted cells carry bit 8 in m1_br_reject.  false (default)
        reverts the pair as before. With muon_decay enabled, a shared connected
        limiter supersedes this option; all neutrino species then use one
        acceptance fraction and bit 16 records limiting.

  trigger:
    type: schema
    description: >
      Delay the whole M1 sector until the compact objects are close enough.
      Neutrinos are irrelevant during a BNS inspiral but M1 is ~64% of a
      timestep, so an inspiral otherwise pays in full for transport that does
      nothing.  Mirrors FIL's Trigger thorn steering
      frankfurt_m1::evolve_radiation off the BNS separation.

      While idle, ALL M1 work is skipped -- neutrino and photon fluxes,
      sources, the implicit solve, backreaction, the closure auxiliaries, the
      eikonal optical depth and the EAS rates -- and the M1 variables are left
      frozen at their atmosphere-floor values.  The trigger is a pure compute
      gate: M1 does not constrain the timestep in Z4 runs, so an idle M1 cannot
      change the inspiral evolution.

      With GRACE_M1_DIAGNOSTICS the EAS still runs in a reduced fugacity-only
      mode, so the chemical potentials and composition keep being written while
      the rates themselves are skipped.

    enabled:
      type: bool
      default: false
      description: >
        Arm the trigger.  False (default) means M1 is active from t=0, i.e. the
        behaviour of every parfile written before the trigger existed.
        Requires co_tracker to be configured with two objects and a positive
        update_every -- GRACE errors out at startup otherwise, rather than
        silently never activating.

    separation:
      type: double
      default: 30.0
      range: "(0,*)"
      description: >
        Coordinate separation [code units] below which M1 activates, read from
        the co_tracker.  Deliberately independent of co_tracker.merge_distance
        (which decides "the binary has merged" and drives regridding): you
        normally want neutrinos switched on somewhat BEFORE merger, so this
        should be the larger of the two.  One-way -- once activated M1 is never
        switched off again, since the separation of a single remnant is
        meaningless.
