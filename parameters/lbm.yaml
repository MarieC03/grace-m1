lbm:
  description: >
    Lattice-Boltzmann radiation transport (build with
    -DGRACE_RADIATION_SCHEME=LBM).  The specific intensity along each
    direction of the compiled-in stencil (GRACE_LBM_STENCIL, direction count
    GRACE_LBM_NDIR) is carried as an inert evolved variable per species and
    advanced once per timestep by a semi-Lagrangian streaming sweep followed
    by an implicit collision step in the fluid frame (Olsen & Rezzolla 2025,
    arXiv:2502.17552).  Species, opacities (m1.eas), atmosphere floors
    (m1.atmosphere) and the activation trigger (m1.trigger) are shared with
    M1; the M1 moments Erad*/Frad* are filled from the quadrature every step.
  type: schema

  bc_kind:
    type: keyword
    allowed: ["none", "outgoing"]
    default: "none"
    description: >
      Physical boundary condition on the intensity populations at the outer
      boundary.  "none" (default) leaves the outer ghost cells at whatever the
      initial data put there, which the semi-Lagrangian pull-back then reads
      as a FIXED INFLOW: the atmosphere floor (no incoming radiation) where the
      initial data is the floor, or a steady source where a beam / sphere
      initial data extends to the boundary -- exactly the reference tests'
      "keep source nodes active".  "outgoing": no incoming radiation -- a
      population whose departure point lies outside the physical domain is set
      to the floor, whatever the ghost cells hold (a copy/extrapolation BC
      would re-inject a beam that touches the boundary).

  stencil_dir:
    type: string
    default: ""
    description: >
      Directory holding the stencil tables.  Empty (default) uses the
      directory compiled in from the source tree (GRACE_LBM_DATA_DIR).  The
      table NAME is fixed at configure time by GRACE_LBM_STENCIL and is not a
      runtime choice, because its direction count sizes the state vector;
      the loader verifies the file's count against the compiled constant.

  streaming:
    type: keyword
    allowed: ["flat_fixed", "curved_fixed"]
    default: "flat_fixed"
    description: >
      Streaming scheme with a fixed (unrotated) stencil.  "flat_fixed":
      straight-line pull-back x - n_d dt, flat spacetime only (refused on a
      curved background).  "curved_fixed": null-geodesic pull-back with the
      frequency shift, from a spherical-harmonic fit of the geodesic map
      sampled on the streaming stencil.  The map is computed once on a
      Cowling background; under Z4 it is rebuilt from the current slice
      every geometry_update_every steps (the slice is frozen over the step,
      first order in time).  Reproduces flat_fixed to round-off in flat
      space.  The adaptive (per-cell rotated) stencil is the next extension.

  streaming_stencil:
    type: string
    default: "Lebedev5"
    description: >
      Table (in the stencil directory) of the low-order quadrature whose
      directions sample the geodesic map for the spherical-harmonic fit of
      curved_fixed streaming.  Lebedev5 (14 directions) integrates the l <= 2
      basis exactly, as in the reference method.

  geodesic_tolerance:
    type: double
    default: 1.e-8
    range: "(0,*)"
    description: >
      Absolute and relative tolerance of the adaptive RK45 integration of the
      backward null geodesics in the curved_fixed geometry pass.  On a
      dynamical (Z4) metric the frozen-slice error dominates, so 1e-6 is
      plenty there.

  initial_data:
    type: keyword
    allowed: ["moments", "intensities"]
    default: "moments"
    description: >
      How the populations are seeded from the M1 initial-data moments.
      "moments": invert a von Mises-Fisher ansatz for every direction.  Exact for
      an isotropic field and right for any physical initial data, but its
      sharpness is capped at the quadrature's sigma_max, so a free-streaming beam
      (|F|/E -> 1) comes out as a cone of half-angle 1/sqrt(sigma_max), about 7
      degrees for Lebedev29, and spreads at that angle for the rest of the run.
      "intensities": a cell whose |F|/E exceeds what the ansatz can represent gets
      all of its E in the single nearest stencil direction instead, which the
      quadrature reproduces exactly and semi-Lagrangian streaming carries without
      spreading (the reference does this for its flat beam test).  Cells below
      that threshold still take the ansatz, so a diffuse region is unaffected.
      Exact only when the beam axis is a stencil direction; a tilted beam is
      mispointed by up to half the direction spacing.

  curved_remap:
    type: keyword
    allowed: ["conservative", "pointwise"]
    default: "conservative"
    description: >
      Form of the curved_fixed sweep.  "conservative": the Killing energy of
      every (cell, direction) bin, sqrt(gamma) w (alpha - beta.n) I, is shared
      out by the bin's claim weight (the adjoint sum of the interpolation
      weights over all arrivals, 1 by Liouville's theorem), so the discrete
      Killing energy is conserved to round-off on a uniform grid; costs a claim
      pass (~ the streaming sweep) and GRACE_LBM_NDIR + 4 aux slots.
      "pointwise": the characteristic solution alone (alpha^4 I interpolated,
      scaled by S^4), which loses Killing energy at first order in dx on a
      curved metric (12% over 9 M on a TOV star at dx = R/10).

  geometry_update_every:
    type: int
    default: 1
    range: "[1,*)"
    description: >
      Z4 only: rebuild the curved_fixed geodesic map every this many steps
      (1 = every step).  N > 1 freezes the map for N steps, an error of order
      N dt d_t(metric) in the departure points; the map is also rebuilt
      whenever dt or the grid changes.  Ignored under Cowling, where the
      metric is static and the map is computed once.

  velocity_lut:
    type: schema
    description: >
      Size of the (theta, phi) lookup table that seeds the barycentric
      interpolation of the populations at off-stencil directions (curved
      streaming).  A coarse table only costs extra triangle walks.

    n_theta:
      type: int
      default: 250
      range: "[8,*)"
      description: >
        Polar nodes of the lookup table.

    n_phi:
      type: int
      default: 500
      range: "[8,*)"
      description: >
        Azimuthal nodes of the lookup table.

  lambda_tolerance:
    type: double
    default: 1.e-4
    range: "(0,*)"
    description: >
      Relative change of the (E, F^i, P^ij) moments below which the collision
      step's lambda iteration is considered converged (reference: 1e-4).

  max_lambda_iterations:
    type: int
    default: 100
    range: "[1,*)"
    description: >
      Cap on the lambda iteration of the collision step (reference: 100;
      typical runs need ~4).  Cells that hit the cap are counted and reported
      per step.

  output_populations:
    type: bool
    default: false
    description: >
      Also write the raw intensity populations (GRACE_LBM_NDIR datasets per
      species, named I<s>_<d>) when a cell-output group requests "lbm".
      Off by default: the moments in the "m1" group and the pressure tensor in
      the "lbm" group are the intended view; the populations are large.

  report_timings:
    type: bool
    default: false
    description: >
      Fence after each LBM kernel and accumulate the wall-clock split of the
      sweep (stream / collide+moments / register copy), printed at
      termination together with the cell- and population-update rates.  The
      fences serialise the device streams, so off by default.
